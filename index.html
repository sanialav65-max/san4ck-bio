<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>san4ck</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent!important;-webkit-touch-callout:none;outline:none}
body{min-height:100vh;background:#080808;display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;z-index:0}
.wrap{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:360px;padding:2.5rem 1.4rem}
.ava{width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,.88);overflow:hidden;margin-bottom:6px;box-shadow:0 0 60px rgba(255,255,255,.07);animation:pop .7s cubic-bezier(.34,1.56,.64,1) both}
.ava img{width:100%;height:100%;object-fit:cover;filter:grayscale(100%)}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.name{font-size:1.25rem;font-weight:900;color:#fff;letter-spacing:.07em;text-transform:uppercase;animation:up .5s .25s ease both}
.sub{font-size:.5rem;color:#3a3a3a;letter-spacing:.2em;margin-bottom:4px;animation:up .5s .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.btn{-webkit-tap-highlight-color:rgba(0,0,0,0)!important;outline:none!important;width:100%;padding:20px 22px;border-radius:18px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;cursor:pointer;box-shadow:0 8px 32px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);opacity:0;transform:translateY(24px);animation:up .5s ease forwards;position:relative;overflow:hidden;transition:background .25s,border-color .25s,transform .2s,box-shadow .2s}
.btn::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);transition:left .5s ease;pointer-events:none}
.btn:hover::after{left:160%}
.btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);transform:translateY(-3px) scale(1.015);box-shadow:0 16px 44px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.12)}
.btn:active{transform:scale(.96) translateY(2px)!important;background:rgba(255,255,255,.07)}
.btn{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;}
.btn:nth-of-type(1){animation-delay:.4s}
.btn:nth-of-type(2){animation-delay:.54s}
.btn:nth-of-type(3){animation-delay:.68s}
.ico{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s}
.btn:hover .ico{background:rgba(255,255,255,.13)}
.ico svg{width:20px;height:20px;fill:#fff}
.lbl{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;flex:1}
.arr{font-size:.9rem;color:rgba(255,255,255,.28);transition:transform .2s,color .2s}
.btn:hover .arr{transform:translateX(5px);color:rgba(255,255,255,.65)}
.foot{margin-top:4px;font-size:.4rem;color:#1e1e1e;letter-spacing:.12em;text-transform:uppercase;animation:up .5s .85s ease both}

@keyframes bounce{
  0%{transform:translateY(0) scale(1)}
  30%{transform:translateY(-8px) scale(1.03)}
  60%{transform:translateY(2px) scale(.98)}
  80%{transform:translateY(-3px) scale(1.01)}
  100%{transform:translateY(0) scale(1)}
}
.bouncing{animation:bounce .4s cubic-bezier(.36,.07,.19,.97) both!important}
</style>
</head>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H,shapes=[];
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);
const types=['rect','circle','triangle','roundrect'];
function newShape(ry){
  const size=25+Math.random()*110;
  return{type:types[Math.floor(Math.random()*4)],x:Math.random()*(W+100)-50,y:ry?Math.random()*H:-size-Math.random()*300,size,speed:.25+Math.random()*.55,rot:Math.random()*Math.PI*2,rs:(Math.random()-.5)*.004,alpha:.025+Math.random()*.065};
}
for(let i=0;i<28;i++)shapes.push(newShape(true));
function draw(s){
  ctx.save();ctx.globalAlpha=s.alpha;ctx.translate(s.x,s.y);ctx.rotate(s.rot);ctx.fillStyle='#787878';ctx.beginPath();
  if(s.type==='circle'){ctx.arc(0,0,s.size/2,0,Math.PI*2);ctx.fill();}
  else if(s.type==='rect'){ctx.fillRect(-s.size/2,-s.size*.3,s.size,s.size*.6);}
  else if(s.type==='triangle'){const r=s.size/2;ctx.moveTo(0,-r);ctx.lineTo(r*.866,r*.5);ctx.lineTo(-r*.866,r*.5);ctx.closePath();ctx.fill();}
  else{const w=s.size,h=s.size*.55,r=12;ctx.moveTo(-w/2+r,-h/2);ctx.lineTo(w/2-r,-h/2);ctx.arcTo(w/2,-h/2,w/2,-h/2+r,r);ctx.lineTo(w/2,h/2-r);ctx.arcTo(w/2,h/2,w/2-r,h/2,r);ctx.lineTo(-w/2+r,h/2);ctx.arcTo(-w/2,h/2,-w/2,h/2-r,r);ctx.lineTo(-w/2,-h/2+r);ctx.arcTo(-w/2,-h/2,-w/2+r,-h/2,r);ctx.closePath();ctx.fill();}
  ctx.restore();
}
function loop(){ctx.clearRect(0,0,W,H);for(const s of shapes){s.y+=s.speed;s.rot+=s.rs;if(s.y>H+s.size+50)Object.assign(s,newShape(false));draw(s);}requestAnimationFrame(loop);}
loop();

// Bounce on tap
document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', function(e) {
    this.classList.remove('bouncing');
    void this.offsetWidth;
    this.classList.add('bouncing');
    this.addEventListener('animationend', () => this.classList.remove('bouncing'), {once:true});

});
